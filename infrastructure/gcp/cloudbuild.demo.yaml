steps:
  - name: gcr.io/cloud-builders/docker
    id: customs
    args:
      - "build"
      - "--target=customs-web"
      - "--build-arg=CUSTOMS_APP_URL=${_CUSTOMS_APP_URL}"
      - "--build-arg=NEXT_PUBLIC_APP_ENV=demo"
      - "--build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      - "--build-arg=GIT_COMMIT_SHA=${_IMAGE_TAG}"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/customs-web:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: tms
    args:
      - "build"
      - "--target=tms-web"
      - "--build-arg=TMS_APP_URL=${_TMS_APP_URL}"
      - "--build-arg=NEXT_PUBLIC_APP_ENV=demo"
      - "--build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      - "--build-arg=GIT_COMMIT_SHA=${_IMAGE_TAG}"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tms-web:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: database
    args:
      - "build"
      - "--target=database"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/database:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: documents
    args:
      - "build"
      - "--target=document-worker"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/document-worker:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: backup
    args:
      - "build"
      - "--target=db-backup"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/db-backup:${_IMAGE_TAG}"
      - "."
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/customs-web:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tms-web:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/database:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/document-worker:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/db-backup:${_IMAGE_TAG}"
options: { machineType: E2_HIGHCPU_8, logging: CLOUD_LOGGING_ONLY }
substitutions:
  _REGION: us-west1
  _REPOSITORY: qubere-demo
  _IMAGE_TAG: manual
  _CUSTOMS_APP_URL: https://customs-gcp.example.com
  _TMS_APP_URL: https://tms-gcp.example.com
  _NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: required-at-submit
