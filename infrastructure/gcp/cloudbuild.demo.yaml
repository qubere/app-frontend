steps:
  - name: gcr.io/cloud-builders/docker
    id: customs
    waitFor: ["-"]
    args:
      - "build"
      - "--target=customs-web"
      - "--build-arg=CUSTOMS_APP_URL=${_CUSTOMS_APP_URL}"
      - "--build-arg=NEXT_PUBLIC_APP_ENV=demo"
      - "--build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      - "--build-arg=GIT_COMMIT_SHA=${_IMAGE_TAG}"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/customs-web:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: tms
    waitFor: ["customs"]
    args:
      - "build"
      - "--target=tms-web"
      - "--build-arg=TMS_APP_URL=${_TMS_APP_URL}"
      - "--build-arg=NEXT_PUBLIC_APP_ENV=demo"
      - "--build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      - "--build-arg=GIT_COMMIT_SHA=${_IMAGE_TAG}"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tms-web:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: database
    waitFor: ["-"]
    args:
      - "build"
      - "--target=database"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/database:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: documents
    waitFor: ["-"]
    args:
      - "build"
      - "--target=document-worker"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/document-worker:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: backup
    waitFor: ["-"]
    args:
      - "build"
      - "--target=db-backup"
      - "--tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/db-backup:${_IMAGE_TAG}"
      - "."
  - name: gcr.io/cloud-builders/docker
    id: push-images
    waitFor: ["customs", "tms", "database", "documents", "backup"]
    entrypoint: bash
    args:
      - "-c"
      - |
        docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/customs-web:${_IMAGE_TAG}"
        docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tms-web:${_IMAGE_TAG}"
        docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/database:${_IMAGE_TAG}"
        docker push "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/document-worker:${_IMAGE_TAG}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: run-migrations
    waitFor: ["push-images"]
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud run jobs deploy qubere-migrate-demo \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/database:${_IMAGE_TAG}" \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --set-secrets="DATABASE_URL=qubere-demo-database-url:latest,DIRECT_URL=qubere-demo-direct-url:latest,PRODUCT_HELP_DATABASE_URL=PRODUCT_HELP_DATABASE_URL:latest" \
          --max-retries=0 \
          --task-timeout=15m
        
        gcloud run jobs execute qubere-migrate-demo \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --wait

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-web-services
    waitFor: ["run-migrations"]
    entrypoint: bash
    args:
      - "-c"
      - |
        gcloud run deploy qubere-customs-demo \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/customs-web:${_IMAGE_TAG}"

        gcloud run deploy qubere-tms-demo \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tms-web:${_IMAGE_TAG}"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/customs-web:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tms-web:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/database:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/document-worker:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/db-backup:${_IMAGE_TAG}"
options: { machineType: E2_HIGHCPU_8, logging: CLOUD_LOGGING_ONLY }
substitutions:
  _REGION: us-west1
  _REPOSITORY: qubere-demo
  _IMAGE_TAG: manual
  _CUSTOMS_APP_URL: https://customs-gcp.example.com
  _TMS_APP_URL: https://tms-gcp.example.com
  _NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: required-at-submit
  _RUNTIME_SERVICE_ACCOUNT: demo-app-runner@qubere-demo.iam.gserviceaccount.com

