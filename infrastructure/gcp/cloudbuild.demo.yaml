steps:
  - name: gcr.io/cloud-builders/docker
    id: build-web
    args:
      - build
      - --target=web
      - --build-arg=NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg=NEXT_PUBLIC_APP_ENV=demo
      - --build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - --build-arg=GIT_COMMIT_SHA=${_IMAGE_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_IMAGE}:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: build-worker
    waitFor: [build-web]
    args:
      - build
      - --target=worker
      - --build-arg=NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg=NEXT_PUBLIC_APP_ENV=demo
      - --build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - --build-arg=GIT_COMMIT_SHA=${_IMAGE_TAG}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WORKER_IMAGE}:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WEB_IMAGE}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_WORKER_IMAGE}:${_IMAGE_TAG}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-west1
  _REPOSITORY: qubere-demo
  _WEB_IMAGE: customs-web
  _WORKER_IMAGE: customs-worker
  _IMAGE_TAG: manual
  _NEXT_PUBLIC_APP_URL: https://demo.qubere.ai
  _NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: required-at-submit
