steps:
  # Parallel Docker Container Builds (waitFor: ["-"] means start concurrently)
  - name: gcr.io/cloud-builders/docker
    id: build-customs
    waitFor: ["-"]
    args:
      - "build"
      - "--target=customs-web"
      - "--build-arg=CUSTOMS_APP_URL=https://demo-clear.qubere.ai"
      - "--build-arg=NEXT_PUBLIC_APP_ENV=demo"
      - "--build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsucXViZXJlLmFpJA"
      - "--build-arg=GIT_COMMIT_SHA=$SHORT_SHA"
      - "-t"
      - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/customs-web:$SHORT_SHA"
      - "-t"
      - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/customs-web:latest"
      - "."

  - name: gcr.io/cloud-builders/docker
    id: build-tms
    waitFor: ["-"]
    args:
      - "build"
      - "--target=tms-web"
      - "--build-arg=TMS_APP_URL=https://demo-tms.qubere.ai"
      - "--build-arg=NEXT_PUBLIC_APP_ENV=demo"
      - "--build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsucXViZXJlLmFpJA"
      - "--build-arg=GIT_COMMIT_SHA=$SHORT_SHA"
      - "-t"
      - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/tms-web:$SHORT_SHA"
      - "-t"
      - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/tms-web:latest"
      - "."

  - name: gcr.io/cloud-builders/docker
    id: build-portal
    waitFor: ["-"]
    args:
      - "build"
      - "--target=portal-web"
      - "--build-arg=PORTAL_APP_URL=https://demo-portal.qubere.ai"
      - "--build-arg=NEXT_PUBLIC_APP_ENV=demo"
      - "--build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsucXViZXJlLmFpJA"
      - "--build-arg=GIT_COMMIT_SHA=$SHORT_SHA"
      - "-t"
      - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/portal-web:$SHORT_SHA"
      - "-t"
      - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/portal-web:latest"
      - "."

  - name: gcr.io/cloud-builders/docker
    id: build-document-worker
    waitFor: ["-"]
    args:
      - "build"
      - "--target=document-worker"
      - "-t"
      - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/document-worker:$SHORT_SHA"
      - "-t"
      - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/document-worker:latest"
      - "."

  # Parallel Cloud Run Deployments (Runs immediately after respective build finishes)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-customs
    waitFor: ["build-customs"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "qubere-customs-demo"
      - "--image=us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/customs-web:$SHORT_SHA"
      - "--region=us-west1"
      - "--project=$PROJECT_ID"
      - "--quiet"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-tms
    waitFor: ["build-tms"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "qubere-tms-demo"
      - "--image=us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/tms-web:$SHORT_SHA"
      - "--region=us-west1"
      - "--project=$PROJECT_ID"
      - "--quiet"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-portal
    waitFor: ["build-portal"]
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "qubere-customer-portal"
      - "--image=us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/portal-web:$SHORT_SHA"
      - "--region=us-west1"
      - "--project=$PROJECT_ID"
      - "--quiet"

images:
  - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/customs-web:$SHORT_SHA"
  - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/customs-web:latest"
  - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/tms-web:$SHORT_SHA"
  - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/tms-web:latest"
  - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/portal-web:$SHORT_SHA"
  - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/portal-web:latest"
  - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/document-worker:$SHORT_SHA"
  - "us-west1-docker.pkg.dev/$PROJECT_ID/qubere-demo/document-worker:latest"

options: { machineType: E2_HIGHCPU_8, logging: CLOUD_LOGGING_ONLY }
