steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=pga-demo-seed
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/pga-demo-seed:${_IMAGE_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/pga-demo-seed:${_IMAGE_TAG}
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: us-west1
  _REPOSITORY: qubere-demo
  _IMAGE_TAG: manual
