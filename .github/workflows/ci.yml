name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qubere_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qubere_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qubere_shadow
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qubere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qubere_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Run Prisma migrations from scratch
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma

      - name: Verify migrations are replay-safe
        run: |
          npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
          npx prisma migrate status --schema=packages/db/prisma/schema.prisma

      - name: Generate Prisma schema drift SQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres qubere_shadow
          npx prisma migrate diff \
            --from-migrations packages/db/prisma/migrations \
            --to-schema-datamodel packages/db/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > prisma-drift.sql

      - name: Upload Prisma schema drift SQL
        uses: actions/upload-artifact@v4
        with:
          name: prisma-schema-drift
          path: prisma-drift.sql
          if-no-files-found: error
          retention-days: 3

      # Prisma has no schema syntax for pgvector's Hnsw index type (only Gin/Gist/
      # SpGist/Brin/Hash), so AccountMemory.embeddingVector's HNSW index -- created
      # by raw migration SQL -- can never be declared in schema.prisma. That makes
      # this diff permanently non-zero until Prisma adds native HNSW support, so
      # it's advisory rather than a hard gate.
      - name: Verify Prisma schema matches migration history
        continue-on-error: true
        run: |
          npx prisma migrate diff \
            --from-migrations packages/db/prisma/migrations \
            --to-schema-datamodel packages/db/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: TypeScript compile
        id: compile
        run: npm run typecheck:workspaces

      - name: Lint
        id: lint
        run: npm run lint

      - name: PGA and assist PostgreSQL integration
        env:
          PGA_ASSIST_INTEGRATION: "1"
        run: npm --workspace @qubere/custom run test -- tests/pga-assists.integration.test.ts

      - name: Unit tests
        if: ${{ !cancelled() && steps.compile.conclusion == 'success' && steps.lint.conclusion == 'success' }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Install Chromium for broker workflow checks
        id: browser_install
        if: ${{ !cancelled() && steps.compile.conclusion == 'success' && steps.lint.conclusion == 'success' }}
        run: npm --workspace @qubere/custom exec -- playwright install --with-deps chromium

      - name: Broker desktop and mobile browser checks
        if: ${{ !cancelled() && steps.browser_install.conclusion == 'success' }}
        run: npm --workspace @qubere/custom run test:e2e -- --config playwright.broker.config.ts

      - name: Upload broker browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-browser-checks
          path: apps/custom/test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: OpenAPI generation must not error
        if: ${{ !cancelled() && steps.compile.conclusion == 'success' && steps.lint.conclusion == 'success' }}
        run: npm run openapi

      - name: Production build
        if: ${{ !cancelled() && steps.compile.conclusion == 'success' && steps.lint.conclusion == 'success' }}
        run: npm run build
